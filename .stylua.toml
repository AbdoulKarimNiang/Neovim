# Match the style already used across this config: two spaces, not stylua's
# default tabs. Windows line endings keep the repo CRLF-consistent, since
# core.autocrlf is false here and every tracked file is already CRLF.
column_width = 120
line_endings = "Windows"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
